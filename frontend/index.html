<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Benchmarking Accelerator</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <style>
    :root {
      --color-primary: #0F172A;
      --color-secondary: #334155;
      --color-text-body: #1E293B;
      --color-bg-subtle: #F8FAFC;
      --color-border: #E2E8F0;
      
      --badge-must-bg: #FEE2E2;
      --badge-must-text: #DC2626;
      --badge-should-bg: #FEF3C7;
      --badge-should-text: #D97706;
      --badge-could-bg: #D1FAE5;
      --badge-could-text: #059669;
    }

    .report-system-spec {
      font-family: Arial, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: var(--color-text-body);
      line-height: 1.5;
    }

    .report-system-spec h1 {
      color: var(--color-primary) !important;
      font-size: 24pt !important;
      font-weight: 700 !important;
      margin-bottom: 8px !important;
      border-bottom: none !important;
    }

    .report-system-spec .subtitle, .report-system-spec p.subtitle {
      color: var(--color-secondary) !important;
      font-size: 14pt !important;
      font-style: italic !important;
      margin-top: 0 !important;
      margin-bottom: 24px !important;
    }

    .report-system-spec h2 {
      color: var(--color-primary) !important;
      font-size: 16pt !important;
      font-weight: 700 !important;
      border-bottom: 2px solid var(--color-border) !important;
      padding-bottom: 6px !important;
      margin-top: 32px !important;
      margin-bottom: 16px !important;
    }

    .report-system-spec h3 {
      color: var(--color-primary) !important;
      font-size: 12pt !important;
      font-weight: 700 !important;
      margin-top: 20px !important;
      margin-bottom: 10px !important;
    }

    .report-system-spec p {
      font-size: 10pt !important;
      color: var(--color-text-body) !important;
      line-height: 1.5 !important;
      text-align: justify !important;
      margin-top: 0 !important;
      margin-bottom: 16px !important;
    }

    .report-system-spec li {
      font-size: 10pt !important;
      color: var(--color-text-body) !important;
      line-height: 1.5 !important;
      margin-bottom: 8px !important;
    }

    .report-system-spec blockquote {
      background-color: var(--color-bg-subtle) !important;
      border-left: 4px solid var(--color-primary) !important;
      border-top: none !important;
      border-right: none !important;
      border-bottom: none !important;
      padding: 12px 16px !important;
      margin-top: 16px !important;
      margin-bottom: 24px !important;
      border-radius: 0 6px 6px 0 !important;
    }

    .report-system-spec blockquote p {
      margin-bottom: 8px !important;
      text-align: justify !important;
    }

    .report-system-spec blockquote p:last-child {
      margin-bottom: 0 !important;
    }

    .report-system-spec .hero-card blockquote,
    .report-system-spec blockquote blockquote {
      border-left: none !important;
      padding-left: 0 !important;
      background: transparent !important;
      margin: 0 !important;
    }

    .report-system-spec table {
      width: 100% !important;
      border-collapse: collapse !important;
      margin-top: 16px !important;
      margin-bottom: 24px !important;
    }

    .report-system-spec th {
      background-color: var(--color-primary) !important;
      color: #FFFFFF !important;
      font-size: 9.5pt !important;
      font-weight: 700 !important;
      text-align: left !important;
      padding: 10px !important;
    }

    .report-system-spec td {
      font-size: 9pt !important;
      padding: 10px !important;
      border-bottom: 1px solid var(--color-border) !important;
      vertical-align: top !important;
    }

    .report-system-spec td:first-child,
    .report-system-spec th:first-child {
      white-space: nowrap !important;
    }

    .report-system-spec tr:nth-child(even) td {
      background-color: var(--color-bg-subtle) !important;
    }

    .report-system-spec pre,
    .report-system-spec code {
      white-space: pre-wrap !important;
      word-break: break-word !important;
      overflow-x: hidden !important;
      max-width: 100% !important;
      background-color: var(--color-bg-subtle) !important;
      border: 1px solid var(--color-border) !important;
      border-radius: 6px !important;
      padding: 12px !important;
      font-size: 8.5pt !important;
    }

    .report-system-spec .badge {
      font-weight: 700 !important;
      font-size: 8pt !important;
      padding: 3px 8px !important;
      border-radius: 9999px !important;
      display: inline-flex !important;
      align-items: center !important;
      text-transform: uppercase !important;
      letter-spacing: 0.025em !important;
      margin: 0 2px !important;
      vertical-align: middle !important;
    }

    .report-system-spec .badge-must {
      background-color: #FEE2E2 !important;
      color: #991B1B !important;
      border: 1px solid #FCA5A5 !important;
    }

    .report-system-spec .badge-should {
      background-color: #FEF3C7 !important;
      color: #92400E !important;
      border: 1px solid #FCD34D !important;
    }

    .report-system-spec .badge-could {
      background-color: #DBEAFE !important;
      color: #1E40AF !important;
      border: 1px solid #93C5FD !important;
    }

    .report-system-spec .badge-wont {
      background-color: #F3F4F6 !important;
      color: #1F2937 !important;
      border: 1px solid #E5E7EB !important;
    }
  </style>
</head>
<body class="bg-gray-50 text-gray-900 font-sans antialiased min-h-screen">
  <div id="root"></div>
  <script type="module" src="./index.tsx"></script>
<script type="module" src="/index.js"></script></body>
</html>
